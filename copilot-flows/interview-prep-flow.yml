name: Interview Prep Flow
version: "1.0"
description: >
  Prepare interview materials for a scheduled interview. Reads role and company
  context from the Roles and Companies sheets and logs interview records to the
  Interviews sheet.

sor_sheets:
  read:
    - Roles
    - Companies
    - Contacts
  write:
    - Interviews
    - StatusHistory
  error_log: FlowErrors
  change_log: ChangeLog

trigger:
  type: manual
  context: role_record

steps:
  - id: gather_context
    type: user_input
    prompt: "Provide interview details"
    fields:
      - name: role_id
        type: text
        required: true
        prompt: "RoleID from the Roles sheet"
      - name: company_id
        type: text
        required: true
        prompt: "CompanyID from the Companies sheet"
      - name: stage
        type: choice
        options:
          - Screen
          - Hiring Manager
          - Panel
          - Final
          - Offer
        required: true
      - name: scheduled_date
        type: date
        required: true
      - name: additional_context
        type: multiline_text
        required: false
        prompt: "Any additional context about the role or interviewer"

  - id: research_company
    type: ai_prompt
    prompt_template: prompts/interview-research.md
    inputs:
      - role_id
      - company_id
      - stage
      - additional_context
    outputs:
      - company_summary
      - anticipated_questions
      - star_stories
      - questions_to_ask

  - id: review_prep_materials
    type: human_review
    content: |
      Company Summary: {{ company_summary }}
      Anticipated Questions: {{ anticipated_questions }}
      STAR Stories: {{ star_stories }}
      Questions to Ask: {{ questions_to_ask }}
    actions:
      - approve
      - revise
      - discard

  - id: log_interview
    type: sor_write
    sheet: Interviews
    condition: "review_prep_materials.action == 'approve'"
    record:
      InterviewID: "{{ uuid() }}"
      RoleID: "{{ role_id }}"
      CompanyID: "{{ company_id }}"
      Stage: "{{ stage }}"
      ScheduledDate: "{{ scheduled_date }}"
      Outcome: Pending
      Notes: "Prep generated by interview-prep-flow.yml"

  - id: log_status_history
    type: sor_write
    sheet: StatusHistory
    condition: "review_prep_materials.action == 'approve'"
    record:
      HistoryID: "{{ uuid() }}"
      EntityType: Interview
      EntityID: "{{ interview_id }}"
      OldStatus: ""
      NewStatus: Pending
      ChangedBy: "interview-prep-flow"
      ChangedAt: "{{ now() }}"

  - id: log_error
    type: sor_write
    sheet: FlowErrors
    condition: "any_step.error"
    record:
      ErrorID: "{{ uuid() }}"
      FlowName: "interview-prep-flow"
      Timestamp: "{{ now() }}"
      ErrorMessage: "{{ error.message }}"
      Payload: "{{ error.payload }}"
      Resolved: "No"
