name: Outreach Flow
version: "1.0"
description: >
  Generate and manage professional outreach messages. Reads contact context from
  the canonical Contacts and Companies sheets and logs activity to the Outreach sheet.

sor_sheets:
  read:
    - Contacts
    - Companies
    - Roles
  write:
    - Outreach
  error_log: FlowErrors
  change_log: ChangeLog

trigger:
  type: manual
  context: contact_record

steps:
  - id: gather_context
    type: user_input
    prompt: "Provide outreach context"
    fields:
      - name: recipient_name
        type: text
        required: true
      - name: recipient_role
        type: text
        required: true
      - name: recipient_company
        type: text
        required: true
      - name: connection_points
        type: multiline_text
        required: true
        prompt: "List shared interests, connections, or relevant context"
      - name: message_type
        type: choice
        options:
          - cold_outreach
          - networking
          - follow_up
          - referral_request
        required: true
      - name: channel
        type: choice
        options:
          - Email
          - LinkedIn
          - Referral
          - Other
        required: true

  - id: generate_message
    type: ai_prompt
    prompt_template: prompts/outreach-email.md
    inputs:
      - recipient_name
      - recipient_role
      - recipient_company
      - connection_points
      - message_type
      - channel
    outputs:
      - generated_message

  - id: review_message
    type: human_review
    content: "{{ generated_message }}"
    actions:
      - approve
      - revise
      - discard

  - id: log_outreach
    type: sor_write
    sheet: Outreach
    condition: "review_message.action == 'approve'"
    record:
      OutreachID: "{{ uuid() }}"
      ContactID: "{{ contact_id }}"
      CompanyID: "{{ company_id }}"
      RoleID: "{{ role_id }}"
      Channel: "{{ channel }}"
      MessageType: "{{ message_type }}"
      SentDate: "{{ today() }}"
      ResponseType: None
      Notes: "Generated by outreach-flow.yml"

  - id: log_error
    type: sor_write
    sheet: FlowErrors
    condition: "any_step.error"
    record:
      ErrorID: "{{ uuid() }}"
      FlowName: "outreach-flow"
      Timestamp: "{{ now() }}"
      ErrorMessage: "{{ error.message }}"
      Payload: "{{ error.payload }}"
      Resolved: "No"
